# Машиночитаемая очередь фаз AIEAR (A6, grill 2026-07-07).
#
# Единственный источник «что дальше» для автономного runner'а (/autonomy:run):
# бери первую фазу со status: ready, у которой все deps закрыты (status: done).
# НЕ выбирать фазу по прозе STATUS.md — она человекочитаемая витрина, не очередь.
#
# status: done      — фаза закрыта (пайплайн пройден; для tier 3+ PR может ждать founder-гейт — см. notes)
#         ready     — можно стартовать (spec status: approved + deps done)
#         blocked   — deps не закрыты
#         stub      — спека не раскрыта (planner раскрывает JIT)
# blocking: true    — фаза держит гейт своей волны
#
# Пишет status ТОЛЬКО memory-curator на phase-close (single-writer, handbook 05).
# Порядок/deps — из .planning/roadmap/{wave-0-spikes,mvp-0}.md + фронтматтеров спек.

