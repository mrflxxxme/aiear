# CI — Android (спайк S1: app/ есть; GH-раннер имеет Google-Maven egress).
# Гейты: lint (ktlint+detekt) → unit → assemble (app + androidTest компилируется).
# Coverage (jacoco) / screenshot (paparazzi) / instrumented (FTL) — в F-фазах.
name: ci-android
on:
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle*", ".github/workflows/ci-android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('app/**') != '' }}   # активируется, когда есть app/
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}   # secrets нельзя в if: → мапим в env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble (app + instrumented test compile)
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      # Coverage (jacoco) + Compose screenshot (paparazzi) подключатся, когда плагины
      # появятся в каталоге (F-фазы). Инструментальные на реальных OEM — Firebase Test
      # Lab, требует GCP_SA_KEY secret.
      - name: Instrumented (Firebase Test Lab)
        if: ${{ env.GCP_SA_KEY != '' }}
        run: 'echo "TODO: gcloud firebase test android run (GMD -> FTL)"'
# Заметка: OEM-killer фон (Xiaomi/Honor) FTL покрывает не полностью —
# физ-OEM sanity делает фаундер на wave-гейте (см. memory/android-oem.md).
