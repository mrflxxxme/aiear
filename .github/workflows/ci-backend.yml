# CI — Backend (шаблон; подключить, когда появится backend/).
# Пока backend/ нет — job зелёный (реальные шаги скипаются step-level hashFiles-гейтом).
name: ci-backend
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

# backend/ ещё нет. hashFiles() НЕЛЬЗЯ в job-level if: (вычисляется до checkout →
# startup_failure) — гейтим каждый шаг на step-level (там hashFiles разрешён, после
# checkout). Нет backend/ → реальные шаги скипаются, job зелёный.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        if: ${{ hashFiles('backend/**') != '' }}
        run: pip install -e "backend/.[dev]" || pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        if: ${{ hashFiles('backend/**') != '' }}
        run: ruff check backend
      - name: Type-check (mypy --strict)
        if: ${{ hashFiles('backend/**') != '' }}
        run: mypy --strict backend
      - name: Tests + coverage
        if: ${{ hashFiles('backend/**') != '' }}
        run: pytest backend --cov=backend --cov-fail-under=70
      - name: Migration safety (squawk)
        if: ${{ hashFiles('backend/**') != '' }}
        run: 'echo "TODO: squawk on new migrations"'
# Ключи STT/LLM/эквайера — только в CI-secrets/env, никогда в коде (reviewer-security гейт).
