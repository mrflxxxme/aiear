# JVM args for the Gradle daemon. -Xmx2g per task pin (4-core sandbox).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# AndroidX (required; support libraries are retired).
android.useAndroidX=true

# Non-transitive R classes: each module gets its own R, smaller + faster.
android.nonTransitiveRClass=true

# Kotlin official code style (aligns with ktlint ktlint_official).
kotlin.code.style=official
